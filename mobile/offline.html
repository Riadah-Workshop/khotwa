<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khotwa</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-content:center;gap:14px;padding:28px;text-align:center;font:400 17px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f6f4;color:#10241f}
