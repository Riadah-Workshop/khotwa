name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

# A new push to the same pull request cancels the older, now-useless run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

# Actions are pinned to full commit SHAs (the comment names the release) so a
# moved tag cannot change what runs here.
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # package.json pins pnpm through "packageManager"; corepack provides that exact version.
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies (lockfile must match package.json)
        run: corepack pnpm install --frozen-lockfile
      - name: Run tests
        run: corepack pnpm test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Typecheck
        run: corepack pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Lint
        run: corepack pnpm lint

  # Builds the same image Coolify builds (this also runs the Dockerfile's own
  # fast test gate and the production build), starts it, and checks it answers.
  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build image
        run: docker build --pull --tag khotwa:ci .
      - name: Start container with throwaway configuration
        run: |
          # Format-valid but meaningless values: the smoke test never logs in.
          secret=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          hash=$(node -e "const c=require('crypto'),b=n=>c.randomBytes(n).toString('base64url');console.log('pbkdf2-sha256\$100000\$'+b(16)+'\$'+b(32))")
          docker run --detach --name khotwa-ci --publish 127.0.0.1:3000:3000 \
            --env KHOTWA_ADMIN_EMAIL=ci@example.invalid \
            --env "KHOTWA_ADMIN_PASSWORD_HASH=$hash" \
            --env "KHOTWA_SESSION_SECRET=$secret" \
            --env KHOTWA_PUBLIC_ORIGINS=http://127.0.0.1:3000 \
            khotwa:ci
      - name: Smoke test
        run: node scripts/ci-smoke.mjs http://127.0.0.1:3000
      - name: Container logs
        if: always()
        run: docker logs khotwa-ci 2>&1 | tail -n 120 || true
